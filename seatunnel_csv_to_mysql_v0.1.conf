sink {
  Jdbc {
    plugin_input = "sink_table"
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://192.168.203.128:3306/mid?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
    user = "etl"
    password = "Etl@1234"
    database = "mid"
    table = "n_kehubie_excel_load_v2"
    batch_size = 1000
    primary_keys = ["路径", "sheet", "行号"]
    connection_check_timeout_sec = 100
    max_retries = 3
  }
}